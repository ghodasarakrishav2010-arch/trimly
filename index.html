<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trimly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #26282b;
    --panel: #2f3236;
    --stage: #1c1d1f;
    --line: #43474d;
    --ink: #ebe9e4;
    --muted: #9ea3ab;
    --accent: #7db4ff;
    --accent-ink: #0d1b2e;
    --danger: #ff9b8f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Familjen Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.45; }
  [hidden] { display: none !important; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Login ---------- */
  #auth { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 380px; }
  .auth-card h1 { font-size: 2.2rem; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .auth-card p.sub { margin: 0 0 24px; color: var(--muted); }
  .tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .tab { background: none; border: 0; padding: 8px 0; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .field { display: block; margin-bottom: 14px; }
  .field span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 0.9rem; }
  .field input { width: 100%; padding: 11px 12px; background: var(--stage); border: 1px solid var(--line); border-radius: 6px; }
  .primary { width: 100%; padding: 12px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; font-weight: 600; margin-top: 6px; }
  .primary:disabled { opacity: 0.6; cursor: default; }
  .msg { min-height: 1.4em; margin-top: 14px; color: var(--danger); font-size: 0.95rem; }
  .setup-note { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 16px; color: var(--muted); font-size: 0.92rem; }

  /* ---------- App ---------- */
  #app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
  header.bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header.bar h1 { font-size: 1.15rem; margin: 0 auto 0 0; font-weight: 600; }
  .who { color: var(--muted); font-size: 0.92rem; }
  .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; }
  .btn:hover { border-color: var(--muted); }
  .btn.solid { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
  .stage { position: relative; background: var(--stage); display: flex; align-items: center; justify-content: center; padding: 18px; min-height: 0; overflow: hidden; }
  .stage canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; }
  .stage.drag { outline: 2px dashed var(--accent); outline-offset: -10px; }
  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; color: var(--muted); }
  .empty strong { color: var(--ink); font-size: 1.25rem; font-weight: 600; }
  aside.panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px; }
  aside.panel.off { opacity: 0.4; pointer-events: none; }
  .panel h2 { font-size: 1rem; font-weight: 600; margin: 0 0 10px; }
  .group { margin-bottom: 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 0.92rem; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .slider { margin-bottom: 12px; }
  .slider label { display: flex; justify-content: space-between; font-size: 0.92rem; color: var(--muted); }
  .slider input[type=range] { width: 100%; accent-color: var(--accent); margin: 4px 0 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; }

  @media (max-width: 820px) {
    #app { height: auto; min-height: 100dvh; }
    main { grid-template-columns: 1fr; }
    .stage { height: 55vh; }
    aside.panel { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="auth">
  <div class="auth-card">
    <h1>Trimly</h1>
    <p class="sub">Sign in to edit your photos.</p>

    <div id="setupNote" class="setup-note" hidden>
      Supabase is not connected yet. Open index.html and paste your Project URL and key at the top of the script.
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabLogin" aria-selected="true" type="button">Log in</button>
      <button class="tab" role="tab" id="tabSignup" aria-selected="false" type="button">Create account</button>
    </div>

    <form id="authForm" autocomplete="on">
      <label class="field"><span>Username</span>
        <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field"><span>Password</span>
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="primary" id="authSubmit" type="submit">Log in</button>
      <div class="msg" id="authMsg" role="alert"></div>
    </form>
  </div>
</section>

<!-- ============ EDITOR ============ -->
<section id="app" hidden>
  <header class="bar">
    <h1>Trimly</h1>
    <span class="who" id="who"></span>
    <button class="btn" id="openBtn" type="button">Open photo</button>
    <select id="fmt" aria-label="Download format">
      <option value="jpg">JPG</option>
      <option value="png">PNG</option>
    </select>
    <button class="btn solid" id="downloadBtn" type="button" disabled>Download</button>
    <button class="btn" id="logoutBtn" type="button">Log out</button>
    <input id="file" type="file" accept="image/*" hidden>
  </header>

  <main>
    <div class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="empty" id="empty">
        <strong>Open a photo to start</strong>
        <span>Choose a photo from your device, or drop one here.</span>
        <button class="btn solid" id="openBtn2" type="button">Choose photo</button>
      </div>
    </div>

    <aside class="panel off" id="panel">
      <div class="group">
        <h2>Filters</h2>
        <div class="chips" id="presets"></div>
      </div>
      <div class="group">
        <h2>Adjust</h2>
        <div id="sliders"></div>
        <div class="row"><button class="btn" id="resetBtn" type="button">Reset adjustments</button></div>
      </div>
      <div class="group">
        <h2>Crop and rotate</h2>
        <div class="chips" id="crops"></div>
        <div class="row">
          <button class="btn" id="rotL" type="button">Rotate left</button>
          <button class="btn" id="rotR" type="button">Rotate right</button>
          <button class="btn" id="flipBtn" type="button">Flip</button>
        </div>
      </div>
    </aside>
  </main>
</section>

<script>
/* =====================================================
   STEP 1: Paste your two Supabase values between the quotes
   ===================================================== */
const SUPABASE_URL = "https://djupszyqcybrgsjbgllj.supabase.co";
const SUPABASE_KEY = "sb_publishable_5dZji_RswiqxS3V8oHVESg_aGDuO-z6";
/* ===================================================== */

const $ = (id) => document.getElementById(id);
const configured = !SUPABASE_URL.startsWith("PASTE") && !SUPABASE_KEY.startsWith("PASTE");
const sb = configured && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const EMAIL_DOMAIN = "photoeditor.app";

/* ---------------- Login / sign up ---------------- */
let mode = "login";

function setMode(m) {
  mode = m;
  $("tabLogin").setAttribute("aria-selected", m === "login");
  $("tabSignup").setAttribute("aria-selected", m === "signup");
  $("authSubmit").textContent = m === "login" ? "Log in" : "Create account";
  $("password").autocomplete = m === "login" ? "current-password" : "new-password";
  $("authMsg").textContent = "";
}
$("tabLogin").onclick = () => setMode("login");
$("tabSignup").onclick = () => setMode("signup");
if (!sb) $("setupNote").hidden = false;

function friendly(text) {
  const t = (text || "").toLowerCase();
  if (t.includes("invalid login")) return "Wrong username or password.";
  if (t.includes("already registered")) return "That username is taken. Try another one.";
  if (t.includes("rate limit")) return "Too many attempts. Wait a few minutes and try again.";
  if (t.includes("at least")) return "Password must be at least 6 characters.";
  return text || "Something went wrong. Try again.";
}

$("authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("authMsg");
  msg.textContent = "";
  if (!sb) { msg.textContent = "Connect Supabase first: add your URL and key at the top of index.html."; return; }

  const user = $("username").value.trim().toLowerCase();
  const pass = $("password").value;
  if (!/^[a-z0-9_]{3,20}$/.test(user)) { msg.textContent = "Username must be 3 to 20 letters, numbers or underscores."; return; }
  if (pass.length < 6) { msg.textContent = "Password must be at least 6 characters."; return; }

  const email = user + "@" + EMAIL_DOMAIN;
  $("authSubmit").disabled = true;
  try {
    if (mode === "signup") {
      const { data, error } = await sb.auth.signUp({ email, password: pass });
      if (error) throw error;
      if (!data.session) {
        msg.textContent = "Account created, but Supabase still asks for email confirmation. Turn off Confirm email in Supabase, then log in.";
      }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
    }
  } catch (err) {
    msg.textContent = friendly(err.message);
  } finally {
    $("authSubmit").disabled = false;
  }
});

function showApp(session) {
  const signedIn = !!session;
  $("auth").hidden = signedIn;
  $("app").hidden = !signedIn;
  if (signedIn) {
    const email = (session.user && session.user.email) || "";
    $("who").textContent = email.split("@")[0];
    $("password").value = "";
  }
}

if (sb) {
  sb.auth.onAuthStateChange((_event, session) => showApp(session));
  sb.auth.getSession().then(({ data }) => showApp(data.session));
}
$("logoutBtn").onclick = async () => { if (sb) await sb.auth.signOut(); showApp(null); };

/* ---------------- Editor ---------------- */
const SLIDERS = [
  { key: "exposure",   label: "Exposure",   min: -100, max: 100 },
  { key: "contrast",   label: "Contrast",   min: -100, max: 100 },
  { key: "saturation", label: "Saturation", min: -100, max: 100 },
  { key: "warmth",     label: "Warmth",     min: -100, max: 100 },
  { key: "tint",       label: "Tint",       min: -100, max: 100 },
  { key: "fade",       label: "Fade",       min: 0,    max: 100 },
  { key: "vignette",   label: "Vignette",   min: 0,    max: 100 }
];
const ZERO = { exposure: 0, contrast: 0, saturation: 0, warmth: 0, tint: 0, fade: 0, vignette: 0 };
const PRESETS = {
  "Original": {},
  "Vivid":  { exposure: 5, contrast: 18, saturation: 35 },
  "Warm":   { exposure: 3, warmth: 30, saturation: 10 },
  "Cool":   { contrast: 8, warmth: -30 },
  "Golden": { exposure: 8, warmth: 40, saturation: 15, fade: 15, vignette: 20 },
  "Film":   { contrast: 10, saturation: -8, warmth: 12, tint: 8, fade: 25, vignette: 15 },
  "Faded":  { contrast: -10, saturation: -15, warmth: 8, fade: 40 },
  "Mono":   { contrast: 15, saturation: -100 },
  "Noir":   { exposure: -8, contrast: 40, saturation: -100, vignette: 45 }
};
const CROPS = [
  { name: "Original", v: null }, { name: "1:1", v: 1 }, { name: "4:5", v: 4 / 5 },
  { name: "3:4", v: 3 / 4 }, { name: "16:9", v: 16 / 9 }
];
const PREVIEW_MAX = 1400;

let img = null, rot = 0, flip = false, aspect = null;
let baseFull = null, basePrev = null;
let adj = { ...ZERO };
let activePreset = "Original";

const view = $("view");
const vctx = view.getContext("2d", { willReadFrequently: true });

/* build controls */
const sliderEls = {};
SLIDERS.forEach((s) => {
  const wrap = document.createElement("div");
  wrap.className = "slider";
  wrap.innerHTML = `<label for="sl_${s.key}"><span>${s.label}</span><span id="val_${s.key}">0</span></label>
    <input type="range" id="sl_${s.key}" min="${s.min}" max="${s.max}" value="0">`;
  $("sliders").appendChild(wrap);
  const input = wrap.querySelector("input");
  sliderEls[s.key] = input;
  input.addEventListener("input", () => {
    adj[s.key] = +input.value;
    $("val_" + s.key).textContent = input.value;
    setActivePreset(null);
    schedule();
  });
});

const presetBtns = {};
Object.keys(PRESETS).forEach((name) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = name;
  b.setAttribute("aria-pressed", name === "Original");
  b.onclick = () => { applyPreset(name); };
  $("presets").appendChild(b);
  presetBtns[name] = b;
});

const cropBtns = [];
CROPS.forEach((c) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = c.name;
  b.setAttribute("aria-pressed", c.v === null);
  b.onclick = () => {
    aspect = c.v;
    cropBtns.forEach((x) => x.setAttribute("aria-pressed", x === b));
    rebuildBase();
  };
  $("crops").appendChild(b);
  cropBtns.push(b);
});

function setActivePreset(name) {
  activePreset = name;
  Object.keys(presetBtns).forEach((n) => presetBtns[n].setAttribute("aria-pressed", n === name));
}
function syncSliders() {
  SLIDERS.forEach((s) => {
    sliderEls[s.key].value = adj[s.key];
    $("val_" + s.key).textContent = adj[s.key];
  });
}
function applyPreset(name) {
  adj = { ...ZERO, ...PRESETS[name] };
  syncSliders();
  setActivePreset(name);
  schedule();
}
$("resetBtn").onclick = () => applyPreset("Original");

/* image geometry: rotate, flip, crop */
function makeBase() {
  const w0 = img.naturalWidth, h0 = img.naturalHeight;
  const odd = rot % 2 === 1;
  const rw = odd ? h0 : w0, rh = odd ? w0 : h0;

  const rc = document.createElement("canvas");
  rc.width = rw; rc.height = rh;
  const rctx = rc.getContext("2d");
  rctx.translate(rw / 2, rh / 2);
  rctx.rotate(rot * Math.PI / 2);
  if (flip) rctx.scale(-1, 1);
  rctx.drawImage(img, -w0 / 2, -h0 / 2);

  if (!aspect) return rc;
  let cw, ch;
  if (rw / rh > aspect) { ch = rh; cw = Math.round(rh * aspect); }
  else { cw = rw; ch = Math.round(rw / aspect); }
  const sx = Math.round((rw - cw) / 2), sy = Math.round((rh - ch) / 2);
  const cc = document.createElement("canvas");
  cc.width = cw; cc.height = ch;
  cc.getContext("2d").drawImage(rc, sx, sy, cw, ch, 0, 0, cw, ch);
  return cc;
}

function rebuildBase() {
  if (!img) return;
  baseFull = makeBase();
  const s = Math.min(1, PREVIEW_MAX / Math.max(baseFull.width, baseFull.height));
  basePrev = document.createElement("canvas");
  basePrev.width = Math.max(1, Math.round(baseFull.width * s));
  basePrev.height = Math.max(1, Math.round(baseFull.height * s));
  basePrev.getContext("2d").drawImage(baseFull, 0, 0, basePrev.width, basePrev.height);
  render();
}

/* pixel adjustments */
function applyAdjustments(d, w, h, a) {
  const mul = Math.pow(2, a.exposure / 60);
  const c = a.contrast * 2.55;
  const cf = (259 * (c + 255)) / (255 * (259 - c));
  const sat = 1 + a.saturation / 100;
  const warm = a.warmth * 0.45;
  const tint = a.tint * 0.3;
  const fade = a.fade / 100;
  const vig = a.vignette / 100;
  const cx = w / 2, cy = h / 2, maxd = Math.sqrt(cx * cx + cy * cy);

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      let r = d[i] * mul, g = d[i + 1] * mul, b = d[i + 2] * mul;

      r += warm + tint * 0.5;
      g -= tint;
      b += -warm + tint * 0.5;

      r = cf * (r - 128) + 128;
      g = cf * (g - 128) + 128;
      b = cf * (b - 128) + 128;

      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
      r = lum + (r - lum) * sat;
      g = lum + (g - lum) * sat;
      b = lum + (b - lum) * sat;

      if (fade > 0) {
        const k = 1 - 0.3 * fade, o = 45 * fade;
        r = r * k + o; g = g * k + o; b = b * k + o;
      }
      if (vig > 0) {
        const dist = Math.hypot(x - cx, y - cy) / maxd;
        const t = Math.max(0, (dist - 0.35) / 0.65);
        const f = 1 - vig * t * t * 0.9;
        r *= f; g *= f; b *= f;
      }
      d[i] = r; d[i + 1] = g; d[i + 2] = b;
    }
  }
}

function render() {
  if (!basePrev) return;
  const w = basePrev.width, h = basePrev.height;
  if (view.width !== w || view.height !== h) { view.width = w; view.height = h; }
  vctx.drawImage(basePrev, 0, 0);
  const id = vctx.getImageData(0, 0, w, h);
  applyAdjustments(id.data, w, h, adj);
  vctx.putImageData(id, 0, 0);
}
let pending = false;
function schedule() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; render(); });
}

/* loading photos */
function loadFile(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    img = im;
    rot = 0; flip = false; aspect = null;
    cropBtns.forEach((x, i) => x.setAttribute("aria-pressed", i === 0));
    adj = { ...ZERO };
    syncSliders();
    setActivePreset("Original");
    $("empty").hidden = true;
    $("panel").classList.remove("off");
    $("downloadBtn").disabled = false;
    rebuildBase();
    URL.revokeObjectURL(url);
  };
  im.onerror = () => { alert("That file could not be opened. Try a JPG or PNG photo."); URL.revokeObjectURL(url); };
  im.src = url;
}
const pick = () => $("file").click();
$("openBtn").onclick = pick;
$("openBtn2").onclick = pick;
$("file").onchange = (e) => { loadFile(e.target.files[0]); e.target.value = ""; };

const stage = $("stage");
stage.addEventListener("dragover", (e) => { e.preventDefault(); stage.classList.add("drag"); });
stage.addEventListener("dragleave", () => stage.classList.remove("drag"));
stage.addEventListener("drop", (e) => {
  e.preventDefault(); stage.classList.remove("drag");
  loadFile(e.dataTransfer.files[0]);
});

/* rotate / flip */
$("rotL").onclick = () => { rot = (rot + 3) % 4; rebuildBase(); };
$("rotR").onclick = () => { rot = (rot + 1) % 4; rebuildBase(); };
$("flipBtn").onclick = () => { flip = !flip; rebuildBase(); };

/* download at full size */
$("downloadBtn").onclick = () => {
  if (!baseFull) return;
  const btn = $("downloadBtn");
  btn.disabled = true; btn.textContent = "Preparing...";
  setTimeout(() => {
    const c = document.createElement("canvas");
    c.width = baseFull.width; c.height = baseFull.height;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(baseFull, 0, 0);
    const id = ctx.getImageData(0, 0, c.width, c.height);
    applyAdjustments(id.data, c.width, c.height, adj);
    ctx.putImageData(id, 0, 0);
    const png = $("fmt").value === "png";
    c.toBlob((blob) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "edited-photo." + (png ? "png" : "jpg");
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      btn.disabled = false; btn.textContent = "Download";
    }, png ? "image/png" : "image/jpeg", 0.92);
  }, 30);
};
</script>
</body>
</html>
